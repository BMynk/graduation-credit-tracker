name: Community checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/test_community.py"
      - "scripts/test_simulated_students.py"
      - "scripts/test_simulated_community.py"
      - "scripts/test_simulated_academics.py"
      - ".github/workflows/community-checks.yml"

permissions:
  contents: read

jobs:
  community-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Community smoke tests
        env:
          SECRET_KEY: community-ci-secret-key
          DATABASE_URL: sqlite:///./community_ci.db
        run: python scripts/test_community.py && python scripts/test_simulated_students.py && python scripts/test_simulated_community.py && python scripts/test_simulated_academics.py && python scripts/test_simple_average.py
