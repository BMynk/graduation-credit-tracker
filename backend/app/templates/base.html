<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* Inline styles for email clients */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 32px 24px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .header .subtitle {
            color: #c7d2fe;
            font-size: 14px;
            margin-top: 4px;
        }
        .content {
            padding: 32px 24px;
            color: #1e293b;
            line-height: 1.6;
        }
        .content h2 {
            color: #0f172a;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 16px;
        }
        .content p {
            margin: 0 0 16px 0;
        }
        .highlight-box {
            background-color: #f1f5f9;
            border-left: 4px solid #4f46e5;
            padding: 16px 20px;
            border-radius: 6px;
            margin: 16px 0;
        }
        .highlight-box .label {
            font-weight: 600;
            color: #0f172a;
        }
        .highlight-box .value {
            color: #4f46e5;
            font-weight: 700;
        }
        .footer {
            background-color: #f8fafc;
            padding: 16px 24px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
        .footer a {
            color: #4f46e5;
            text-decoration: none;
        }
        .btn {
            display: inline-block;
            background-color: #4f46e5;
            color: #ffffff !important;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin: 8px 0;
        }
        .divider {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 24px 0;
        }
        @media (max-width: 480px) {
            .container { border-radius: 0; }
            .header { padding: 24px 16px; }
            .content { padding: 24px 16px; }
        }
    </style>
</head>
<body>
    <div style="background-color:#f8fafc; padding:20px 0;">
        <div class="container">
            <!-- Header -->
            <div class="header">
                <h1>🎓 Graduation Credit Tracker</h1>
                <div class="subtitle">Your academic journey, tracked.</div>
            </div>

            <!-- Content -->
            <div class="content">
                {% block content %}{% endblock %}
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>
                    &copy; 2026 Graduation Credit Tracker &bull;
                    <a href="{{ base_url }}">{{ base_url }}</a>
                </p>
                <p style="margin:4px 0 0; color:#cbd5e1;">
                    This is an automated message. Please do not reply to this email.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
