<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ subject|default("Graduation Credit Tracker") }}</title>
</head>

<body
    style="
        margin:0;
        padding:0;
        background:#f4f7fb;
        font-family:Arial,Helvetica,sans-serif;
        color:#172033;
    "
>

<table
    role="presentation"
    width="100%"
    cellspacing="0"
    cellpadding="0"
    border="0"
    style="background:#f4f7fb;"
>
<tr>
<td
    align="center"
    style="padding:32px 14px;"
>

<table
    role="presentation"
    width="100%"
    cellspacing="0"
    cellpadding="0"
    border="0"
    style="
        max-width:620px;
        background:#ffffff;
        border-radius:18px;
        overflow:hidden;
        border:1px solid #e5eaf1;
        box-shadow:0 8px 30px rgba(15,23,42,.08);
    "
>

    <!-- BRAND HEADER -->
    <tr>
        <td
            style="
                background:#0b1220;
                padding:25px 30px;
            "
        >
            <table
                role="presentation"
                width="100%"
                cellspacing="0"
                cellpadding="0"
            >
                <tr>
                    <td>
                        <div
                            style="
                                color:#ffffff;
                                font-size:20px;
                                font-weight:700;
                                line-height:1.2;
                            "
                        >
                            🎓 Graduation Credit Tracker
                        </div>

                        <div
                            style="
                                color:#94a3b8;
                                font-size:12px;
                                margin-top:7px;
                                letter-spacing:.3px;
                            "
                        >
                            Track &nbsp;•&nbsp;
                            Plan &nbsp;•&nbsp;
                            Achieve &nbsp;•&nbsp;
                            Graduate
                        </div>
                    </td>

                    <td
                        align="right"
                        style="
                            color:#cbd5e1;
                            font-size:11px;
                        "
                    >
                        Academic Progress
                        <div
                            style="
                                width:50px;
                                height:3px;
                                background:#3b6ff5;
                                border-radius:10px;
                                margin:8px 0 0 auto;
                            "
                        ></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- CONTENT -->
    <tr>
        <td
            style="
                padding:36px 34px;
                line-height:1.65;
            "
        >
            {% block content %}{% endblock %}
        </td>
    </tr>

    <!-- FOOTER -->
    <tr>
        <td
            style="
                padding:22px 30px;
                background:#f8fafc;
                border-top:1px solid #e8edf4;
                color:#7b8799;
                font-size:12px;
                text-align:center;
                line-height:1.6;
            "
        >
            <strong style="color:#334155;">
                Graduation Credit Tracker
            </strong>

            <br>

            Your academic journey, tracked.

            <br><br>

            This is an automated message.
            Please do not reply to this email.

            <br>

            © 2026 Graduation Credit Tracker
        </td>
    </tr>

</table>

</td>
</tr>
</table>

</body>
</html>
